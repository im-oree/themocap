<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Web Mocap Studio</title>
    <meta name="description" content="Browser-native markerless motion capture." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!--
      Theme bootstrap: runs before first paint so there is never a flash of the
      wrong theme. Must stay in sync with packages/ui/src/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wms-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var choice = stored === 'light' || stored === 'dark' ? stored : null;
          var theme = choice || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private mode / storage disabled: fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
