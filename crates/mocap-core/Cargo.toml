[package]
name = "mocap-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compute core (filters, math) for Web Mocap Studio, compiled to WASM."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
